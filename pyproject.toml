# Tool settings only: dependencies are pinned in requirements.txt and the other requirements-*.txt (README).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["graph/frontend"]

[tool.ruff.lint]
# the base shared by every repository: pyflakes (F), the pycodestyle errors
# that are bugs or hide statements (E4, E7, E9), whitespace (W) and import order (I); complexity is the metrics gate
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then taken as arguments, which pyflakes reads as a redefinition
"tests/**" = ["F811"]

[tool.code-metrics]
# what ops/code_metrics.py measures (that script is the same file in every repository)
paths = [
    "api",
    "clean",
    "fetch",
    "graph",
    "main_etl.py",
    "ops",
    "run",
    "settings.py",
    "store",
]
