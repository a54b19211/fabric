# Tool settings only: dependencies are pinned in requirements.txt and the other requirements-*.txt (README).
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
# pyflakes (F) and the pycodestyle errors that are bugs or hide statements (E4, E7, E9). Line length (E501),
# import order (I) and whitespace (W) are not enforced in this codebase.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then taken as arguments, which pyflakes reads as a redefinition
"tests/**" = ["F811"]
