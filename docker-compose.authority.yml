# =============================================================================
# 权威标识符依赖 本地容器化部署（可复现性保障）
#
# 对应开题报告：内容二(2) 标准标识符对齐——「权威依赖（GSRS/ICD-11/OLS4）拟以
# 容器化方式本地部署」；研究方法·可复现性保障——「提供一键启动的环境编排文件」。
#
# 用法：
#     docker compose -f docker-compose.authority.yml up -d
#
# 说明：
#   - 三个源均为本地化部署，避免实验依赖公网可用性、保证可复现；
#   - 未部署前，core_engine/authority_resolver.py 中对应的 GSRS_BASE / ICD11_BASE
#     为空，适配器自动降级（degraded=True），不影响主流程。
#   - ⚠️ 镜像名/版本需按各项目官方文档最终核对（下列为已知官方入口，非捏造）。
# =============================================================================

services:
  # ── GSRS/UNII（ISO 11238 官方可执行实现，Apache-2.0 可自部署）────────────
  # 源码：https://github.com/ncats/gsrs —— 官方提供 Dockerfile，需本地构建。
  gsrs:
    build:
      context: ./docker/gsrs          # 放入 ginas/gsrs 源码后按官方 Dockerfile 构建
    # image: gsrs:local              # 构建产物标签
    container_name: zk_gsrs
    ports:
      - "8090:8080"
    restart: unless-stopped

  # ── ICD-11（WHO 官方容器，离线可部署）────────────────────────────────────
  # WHO 发布 ICD-11 官方 Docker 镜像文件（tar），需先 docker load 载入。
  icd11:
    image: icd11:local                # docker load 后重打标签
    container_name: zk_icd11
    ports:
      - "8084:8080"
    restart: unless-stopped

  # ── OLS4（本体术语对齐，已取代 OLS3）─────────────────────────────────────
  # 源码：https://github.com/EBISPOT/ols4 —— 官方提供 docker 编排。
  # 简化起见此处以单容器呈现；正式部署建议参照官方 ols4 的 neo4j+solr+web 组合。
  ols4:
    image: ebispot/ols4:latest        # 需按官方镜像/标签核对
    container_name: zk_ols4
    ports:
      - "8091:8080"
    restart: unless-stopped
